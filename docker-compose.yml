# Production-style stack: app + PostgreSQL.
#   cp .env.example .env   # set SECRET_KEY, ADMIN_PASSWORD, POSTGRES_PASSWORD, APP_ENV=production
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenderbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tenderbuddy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tenderbuddy:${POSTGRES_PASSWORD}@db:5432/tenderbuddy
      DATA_DIR: /data
    ports:
      - "${PORT:-8004}:8004"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
