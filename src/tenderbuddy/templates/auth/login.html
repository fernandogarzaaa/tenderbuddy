<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-stone-100 flex items-center justify-center min-h-screen">
  <form method="post" action="/login" class="bg-white p-8 rounded-xl shadow w-96 space-y-4">
    {{ csrf_field }}
    <div class="text-2xl font-bold tracking-tight"><span class="text-orange-600">&#9632;</span> {{ app_name }}</div>
    <p class="text-sm text-stone-500">Sign in to continue.</p>
    {% if error == "locked" %}<div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2">Too many failed attempts. Try again in a few minutes.</div>
    {% elif error %}<div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2">Invalid email or password.</div>{% endif %}
    <label class="block text-sm font-medium">Email
      <input name="email" type="email" required autocomplete="username" class="mt-1 w-full border border-stone-300 rounded px-3 py-2"></label>
    <label class="block text-sm font-medium">Password
      <input name="password" type="password" required autocomplete="current-password" class="mt-1 w-full border border-stone-300 rounded px-3 py-2"></label>
    <button class="w-full bg-orange-600 text-white rounded px-3 py-2 font-medium hover:bg-orange-700">Sign in</button>
  </form>
</body>
</html>
